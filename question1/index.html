<!DOCTYPE html>
<html>
<head>
<style>
.container{
    position: relative;
    width: 60px;
    height: 60px;
    margin: 100px auto;
}

.circle{
    position: absolute;
    border-radius: 50%;
}

.circle1{
    width: 60px;
    height: 60px;
    background-color: red;
}

.circle2{
    width: 40px;
    height: 40px;
    background-color: blue;
    top: 10px;
    left: 10px;
}

.circle3{
    width: 20px;
    height: 20px;
    background-color: green;
    top: 20px;
    left: 20px;
}
</style>
</head>
<body>

<div class="container">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
</div>

</body>
</html>
